name: jarrlyyui Flutter Renderer

on:
  push:
    branches: [main]
    paths:
      - 'packages/jarrlyyui_flutter/**'
      - 'packages/jarrlyyui_bundle/**'
      - 'packages/jarrlyyui_language/**'
      - '.github/workflows/jarrlyyui-flutter.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    paths:
      - 'packages/jarrlyyui_flutter/**'
      - 'packages/jarrlyyui_language/**'
      - '.github/workflows/jarrlyyui-flutter.yml'

permissions:
  contents: read

concurrency:
  group: jarrlyyui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install renderer dependencies
        working-directory: packages/jarrlyyui_flutter
        run: flutter pub get
      - name: Check renderer formatting
        working-directory: packages/jarrlyyui_flutter
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze renderer
        working-directory: packages/jarrlyyui_flutter
        run: flutter analyze --fatal-infos
      - name: Test renderer
        working-directory: packages/jarrlyyui_flutter
        run: flutter test

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install bundle dependencies
        working-directory: packages/jarrlyyui_bundle
        run: dart pub get
      - name: Check bundle formatting
        working-directory: packages/jarrlyyui_bundle
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze bundle
        working-directory: packages/jarrlyyui_bundle
        run: dart analyze
      - name: Test bundle validation and updates
        working-directory: packages/jarrlyyui_bundle
        run: dart test
