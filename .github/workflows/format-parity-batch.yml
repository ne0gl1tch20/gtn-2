name: Format parity batch once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format changed parity files
        run: |
          dart format lib/legacy/legacy_pages.dart lib/legacy/legacy_systems_page.dart lib/settings/game_settings.dart lib/settings/settings_page.dart lib/home/game_dashboard_page.dart test/widget_test.dart test/settings/settings_page_test.dart
      - name: Commit formatting only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/legacy/legacy_pages.dart lib/legacy/legacy_systems_page.dart lib/settings/game_settings.dart lib/settings/settings_page.dart lib/home/game_dashboard_page.dart test/widget_test.dart test/settings/settings_page_test.dart
            git commit -m "style: format parity batch Dart files"
            git push origin HEAD:main
          fi
