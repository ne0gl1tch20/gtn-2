name: Temporary Batch A Menu Studio test formatter

on:
  push:
    branches: ['batch-a/creative-save-active-slot']

permissions:
  contents: write

concurrency:
  group: batch-a-menu-studio-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format Dart sources
        run: dart format .
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "All Dart files already formatted."
          else
            git commit -m "style: format Menu Studio persistence regression"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
