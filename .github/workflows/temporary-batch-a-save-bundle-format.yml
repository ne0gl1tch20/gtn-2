name: Temporary Batch A save bundle formatter

on:
  push:
    branches: ['batch-a/creative-save-active-slot']
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: batch-a-save-bundle-format
  cancel-in-progress: false

jobs:
  format-save-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ne0gl1tch20/GuessTheNumber
          ref: fe9cf567169e19059e0330d08769fe454336ef94
          path: gtn1-source
      - name: Bundle GTN1 source assets
        run: bash scripts/sync_gtn1_assets.sh gtn1-source
      - name: Verify GTN1 assets and localization contract
        run: |
          python scripts/verify_gtn1_assets.py
          python scripts/validate_localization_contract.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Restore analysis configuration
        run: git restore -- analysis_options.yaml
      - name: Format the repository exactly as Validate does
        run: dart format .
      - name: Commit formatter output
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/saves/legacy_gtn1_save_adapter.dart test/data/saves/legacy_gtn1_backup_bundle_test.dart test/data/saves/save_bundle_storage_parity_test.dart
          if git diff --cached --quiet; then
            echo "Save bundle adapter and tests already formatted."
          else
            git commit -m "style(saves): format GTN1 bundle migration tests"
            git push origin "HEAD:${TARGET_REF}"
          fi
