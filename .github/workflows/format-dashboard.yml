name: One-time dashboard formatter

on:
  push:
    branches: [main]
    paths:
      - 'lib/home/game_dashboard_page.dart'
      - 'test/widget_test.dart'
      - '.github/workflows/format-dashboard.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Format dashboard parity changes
        run: dart format lib/home/game_dashboard_page.dart test/widget_test.dart
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/home/game_dashboard_page.dart test/widget_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(dashboard): format parity additions"
            git push
          fi
