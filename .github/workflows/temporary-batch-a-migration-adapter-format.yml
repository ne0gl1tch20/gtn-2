name: Temporary Batch A migration adapter formatter

on:
  push:
    branches: ['batch-a/creative-save-active-slot']
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: batch-a-migration-adapter-format
  cancel-in-progress: false

jobs:
  format-migration-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format migration adapter and tests
        run: dart format lib/data/saves/legacy_gtn1_save_adapter.dart test/data/saves/legacy_gtn1_save_adapter_test.dart
      - name: Commit formatter output
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/saves/legacy_gtn1_save_adapter.dart test/data/saves/legacy_gtn1_save_adapter_test.dart
          if git diff --cached --quiet; then
            echo "Migration adapter and tests already formatted."
          else
            git commit -m "style(saves): format GTN1 migration adapter"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
