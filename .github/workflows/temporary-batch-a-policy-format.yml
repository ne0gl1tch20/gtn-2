name: Temporary Batch A single-file formatter

on:
  push:
    branches: ['batch-a/creative-save-active-slot']

permissions:
  contents: write

concurrency:
  group: batch-a-single-file-format
  cancel-in-progress: false

jobs:
  format-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format only Creative Save policy
        run: dart format lib/core/creative/creative_save_policy.dart
      - name: Commit only the formatted policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/creative/creative_save_policy.dart
          if git diff --cached --quiet; then
            echo "Policy already formatted."
          else
            git commit -m "style(creative): apply Dart formatter to save policy"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
