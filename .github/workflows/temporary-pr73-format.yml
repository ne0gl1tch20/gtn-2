name: Temporary PR 73 Dart formatter

on:
  push:
    branches:
      - port/gtn1-random-events-main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart format lib/core/progression/progression_state.dart lib/home/game_dashboard_page.dart test/core/events/random_event_engine_test.dart test/core/scripting/lua_sandbox_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/progression/progression_state.dart lib/home/game_dashboard_page.dart test/core/events/random_event_engine_test.dart test/core/scripting/lua_sandbox_test.dart
          git commit -m "style: format random event implementation"
          git push
