name: Stable Debug Update

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stable-debug-main
  cancel-in-progress: true

jobs:
  signing-check:
    runs-on: ubuntu-latest
    outputs:
      has_keystore: ${{ steps.check.outputs.has_keystore }}
    steps:
      - id: check
        env:
          KEYSTORE_B64: ${{ secrets.GTN2_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GTN2_DEBUG_KEYSTORE_BASE64 is not configured; signed Stable Debug publishing is skipped."
          fi

  build-and-publish:
    needs: signing-check
    if: needs.signing-check.outputs.has_keystore == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name=gtn_2 --org=com.jarrlyyy .
      - name: Configure Android package installation permission
        run: python3 scripts/configure_android_updater.py
      - name: Install dependencies
        run: flutter pub get
      - name: Validate
        run: |
          dart format --output=none .
          flutter analyze --fatal-infos
          flutter test
      - name: Restore stable debug signing key
        env:
          KEYSTORE_B64: ${{ secrets.GTN2_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build signed debug APK
        run: |
          flutter build apk --debug \
            --build-name=2.0.0 \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=APP_VERSION=2.0.0 \
            --dart-define=APP_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
      - name: Prepare update metadata
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-debug.apk release/GuessTheNumber-debug.apk
          cd release
          sha256sum GuessTheNumber-debug.apk > SHA256SUMS
          checksum="$(cut -d ' ' -f 1 SHA256SUMS)"
          printf '{"channel":"android-debug","packageName":"com.jarrlyyy.gtn_2","versionName":"2.0.0","versionCode":%s,"runNumber":%s,"commit":"%s","sha256":"%s","assetName":"GuessTheNumber-debug.apk"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$checksum" > update-manifest.json
      - name: Upload 7-day build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtn-2-stable-debug-${{ github.run_number }}
          path: |
            release/GuessTheNumber-debug.apk
            release/SHA256SUMS
            release/update-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Publish replaceable Stable Debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(printf 'Stable Debug #%s\n\nVersion: 2.0.0 (%s)\nCommit: %s\n\n- Signed Android debug build.\n- APK SHA-256 is published in SHA256SUMS and update-manifest.json.' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")"
          gh release view debug-latest >/dev/null 2>&1 || gh release create debug-latest --target "$GITHUB_SHA" --title "GTN2 Stable Debug" --notes "Publishing Stable Debug..."
          gh release upload debug-latest release/GuessTheNumber-debug.apk release/SHA256SUMS release/update-manifest.json --clobber
          gh release edit debug-latest --target "$GITHUB_SHA" --title "GTN2 Stable Debug" --notes "$notes"
          test "$(gh release view debug-latest --json body --jq .body)" = "$notes"
