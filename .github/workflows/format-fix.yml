name: Temporary Dart format repair

on:
  push:
    branches:
      - batch-a/creative-save-active-slot

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Apply Dart formatter
        run: dart format lib/main.dart lib/saves/save_slots_page.dart lib/settings/settings_page.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/saves/save_slots_page.dart lib/settings/settings_page.dart
          git commit -m "style: format startup and save slot fixes [skip ci]"
          git push
