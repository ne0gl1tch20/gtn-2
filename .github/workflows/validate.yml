name: Validate

on:
  push:
    branches: ['port/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# CI formatting is committed before Android and Windows validation jobs.
# Keep the release artifact short-lived and traceable to this exact build.
# Recheck analyzer warnings after wiring the Settings routes.

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Dart sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: flutter pub get
      - name: Apply Dart quick fixes
        run: dart fix --apply
      - name: Format Dart sources
        run: dart format .
      - name: Commit formatting changes
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if git diff --quiet -- '*.dart'; then
            echo "Dart sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.dart'
          git commit -m "chore: format Dart sources"
          git push origin "HEAD:${TARGET_BRANCH}"

  validate:
    name: Format, analyze, test and Android debug build
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Fetch GTN1 source assets
        uses: actions/checkout@v4
        with:
          repository: ne0gl1tch20/GuessTheNumber
          ref: fe9cf567169e19059e0330d08769fe454336ef94
          path: gtn1-source
      - name: Bundle GTN1 artwork and offline fonts
        run: bash scripts/sync_gtn1_assets.sh gtn1-source
      - name: Verify complete GTN1 content bundle
        run: python scripts/verify_gtn1_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name=gtn_2 --org=com.jarrlyyy .
      - name: Cache Gradle distributions and dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Android package installation and plugin SDK
        run: python3 scripts/configure_android_updater.py
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  windows-build:
    name: Windows desktop debug build
    runs-on: windows-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Fetch GTN1 source assets
        uses: actions/checkout@v4
        with:
          repository: ne0gl1tch20/GuessTheNumber
          ref: fe9cf567169e19059e0330d08769fe454336ef94
          path: gtn1-source
      - name: Bundle GTN1 artwork and offline fonts
        shell: bash
        run: bash scripts/sync_gtn1_assets.sh gtn1-source
      - name: Verify complete GTN1 content bundle
        run: python scripts/verify_gtn1_assets.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows project
        run: flutter create --platforms=windows --project-name=gtn_2 --org=com.jarrlyyy .
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows debug app
        run: flutter build windows --debug
