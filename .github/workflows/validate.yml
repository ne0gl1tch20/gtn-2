name: Validate

on:
  push:
    branches: ['main', 'master', 'port/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Dart sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dart dependencies
        run: flutter pub get
      - name: Restore analysis configuration
        run: git restore -- analysis_options.yaml
      - name: Diagnose and verify Dart formatting
        run: |
          dart format test/legacy/legacy_hub_persistence_test.dart
          git diff -- test/legacy/legacy_hub_persistence_test.dart
          dart format --output=none --set-exit-if-changed .
