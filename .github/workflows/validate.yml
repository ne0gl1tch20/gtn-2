name: Validate

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, test and Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GTN1 source assets
        uses: actions/checkout@v4
        with:
          repository: ne0gl1tch20/GuessTheNumber
          ref: fe9cf567169e19059e0330d08769fe454336ef94
          path: gtn1-source
      - name: Bundle GTN1 artwork and offline fonts
        run: bash scripts/sync_gtn1_assets.sh gtn1-source
      - name: Verify complete GTN1 content bundle
        run: python scripts/verify_gtn1_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name=gtn_2 --org=com.jarrlyyy .
      - name: Configure Android package installation and plugin SDK
        run: python3 scripts/configure_android_updater.py
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none .
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
