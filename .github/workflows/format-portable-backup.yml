name: One-time portable backup formatter

on:
  push:
    branches: [main]
    paths:
      - 'lib/data/saves/portable_save_backup.dart'
      - 'test/data/saves/portable_save_backup_test.dart'
      - '.github/workflows/format-portable-backup.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Format portable backup implementation and tests
        run: dart format lib/data/saves/portable_save_backup.dart test/data/saves/portable_save_backup_test.dart
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/saves/portable_save_backup.dart test/data/saves/portable_save_backup_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(saves): format portable backup implementation"
            git push
          fi
