name: One-time progression formatter
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format changed Dart files
        run: dart format lib/progression/progression_hub_page.dart test/widget_test.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/progression/progression_hub_page.dart test/widget_test.dart
          git commit -m "style: format progression parity changes"
          git push origin HEAD:main
