name: One-time Batch A formatter

on:
  push:
    branches: [main]
    paths:
      - 'lib/home/game_dashboard_page.dart'
      - 'test/settings/settings_page_test.dart'
      - 'test/settings/menu_studio_page_test.dart'
      - 'test/profile/player_profile_page_test.dart'
      - 'test/widget_test.dart'
      - 'lib/data/saves/portable_save_backup.dart'
      - 'test/data/saves/portable_save_backup_test.dart'
      - '.github/workflows/format-batch-a.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Format Batch A changes
        run: dart format lib/home/game_dashboard_page.dart test/settings/settings_page_test.dart test/settings/menu_studio_page_test.dart test/profile/player_profile_page_test.dart test/widget_test.dart lib/data/saves/portable_save_backup.dart test/data/saves/portable_save_backup_test.dart
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/home/game_dashboard_page.dart test/settings/settings_page_test.dart test/settings/menu_studio_page_test.dart test/profile/player_profile_page_test.dart test/widget_test.dart lib/data/saves/portable_save_backup.dart test/data/saves/portable_save_backup_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(parity): format Batch A verification fixes"
            git push
          fi
