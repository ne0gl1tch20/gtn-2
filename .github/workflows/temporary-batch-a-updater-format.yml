name: Temporary Batch A updater formatter

on:
  push:
    branches: ['batch-a/creative-save-active-slot']

permissions:
  contents: write

concurrency:
  group: batch-a-updater-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: git restore -- analysis_options.yaml
      - name: Format updater parity files
        run: dart format lib/home/game_dashboard_page.dart lib/legacy/legacy_pages.dart lib/main.dart lib/settings/settings_page.dart test/data/update_check_schedule_test.dart test/settings/settings_page_test.dart test/widget_test.dart
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/home/game_dashboard_page.dart lib/legacy/legacy_pages.dart lib/main.dart lib/settings/settings_page.dart test/data/update_check_schedule_test.dart test/settings/settings_page_test.dart test/widget_test.dart
          if git diff --cached --quiet; then
            echo "Updater parity files are already formatted."
          else
            git commit -m "style: format GTN1 updater parity changes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
