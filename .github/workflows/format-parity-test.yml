name: One-time parity test formatter

on:
  push:
    branches: [main]
    paths:
      - 'test/settings/menu_studio_page_test.dart'
      - '.github/workflows/format-parity-test.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Format parity test
        run: dart format test/settings/menu_studio_page_test.dart
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/settings/menu_studio_page_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style(menu-studio): format root scroll test"
            git push
          fi
