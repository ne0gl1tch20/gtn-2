name: One-time Batch A formatter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-batch-a-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format Batch A files
        run: dart format lib/home/game_dashboard_page.dart test/widget_test.dart test/settings/menu_studio_page_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/home/game_dashboard_page.dart test/widget_test.dart test/settings/menu_studio_page_test.dart
          git commit -m "style(more): format icon parity assertions"
          git push origin HEAD:main
