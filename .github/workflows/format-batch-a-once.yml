name: One-time Batch A formatter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-batch-a-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - name: Format Batch A test
        run: dart format test/settings/settings_page_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/settings/settings_page_test.dart
          git commit -m "style: format Batch A settings test"
          git push
