name: Build

on:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug APK
    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GTN1 source assets
        uses: actions/checkout@v4
        with:
          repository: ne0gl1tch20/GuessTheNumber
          ref: fe9cf567169e19059e0330d08769fe454336ef94
          path: gtn1-source
      - name: Bundle GTN1 artwork and offline fonts
        run: bash scripts/sync_gtn1_assets.sh gtn1-source
      - name: Verify complete GTN1 content bundle
        run: python scripts/verify_gtn1_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name=gtn_2 --org=com.jarrlyyy .
      - name: Configure Android package installation permission
        run: python3 scripts/configure_android_updater.py
      - name: Cache Gradle distributions and dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: flutter pub get
      - name: Read app version
        shell: bash
        run: |
          version_name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          test -n "$version_name"
          echo "APP_VERSION=$version_name" >> "$GITHUB_ENV"
      - name: Build debug APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER" --dart-define=APP_VERSION="$APP_VERSION" --dart-define=APP_BUILD_NUMBER="$GITHUB_RUN_NUMBER"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1
      - name: Sign Android debug APK with the permanent GTN2 key
        shell: bash
        env:
          GTN2_DEBUG_KEYSTORE_BASE64: ${{ secrets.GTN2_DEBUG_KEYSTORE_BASE64 }}
          GTN2_DEBUG_KEY_ALIAS: ${{ secrets.GTN2_DEBUG_KEY_ALIAS }}
          GTN2_DEBUG_KEY_PASSWORD: ${{ secrets.GTN2_DEBUG_KEY_PASSWORD }}
          GTN2_DEBUG_STORE_PASSWORD: ${{ secrets.GTN2_DEBUG_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in GTN2_DEBUG_KEYSTORE_BASE64 GTN2_DEBUG_KEY_ALIAS GTN2_DEBUG_KEY_PASSWORD GTN2_DEBUG_STORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/zipalign"
          unsigned="build/app/outputs/flutter-apk/app-debug.apk"
          aligned="$RUNNER_TEMP/gtn2-debug-aligned.apk"
          signed="$RUNNER_TEMP/GuessTheNumber-debug.apk"
          keystore="$RUNNER_TEMP/gtn2-debug-signing.jks"
          printf '%s' "$GTN2_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          "$build_tools/zipalign" -f -p 4 "$unsigned" "$aligned"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$GTN2_DEBUG_KEY_ALIAS" \
            --ks-pass env:GTN2_DEBUG_STORE_PASSWORD \
            --key-pass env:GTN2_DEBUG_KEY_PASSWORD \
            --out "$signed" \
            "$aligned"
          "$build_tools/apksigner" verify --verbose --print-certs "$signed" | tee "$RUNNER_TEMP/gtn2-apksigner-verify.txt"
          cert_sha="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: *//p' "$RUNNER_TEMP/gtn2-apksigner-verify.txt" | head -n 1 | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$cert_sha" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Could not extract the signed APK certificate SHA-256 fingerprint."
            exit 1
          fi
          install -m 644 "$signed" "$unsigned"
          mkdir -p build/signing
          printf '%s\n' "$cert_sha" > build/signing/android-debug-certificate-sha256.txt
          rm -f "$keystore" "$aligned" "$signed" "$RUNNER_TEMP/gtn2-apksigner-verify.txt"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gtn-2-debug-android
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/signing/android-debug-certificate-sha256.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows desktop debug
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GTN1 source assets
        uses: actions/checkout@v4
        with:
          repository: ne0gl1tch20/GuessTheNumber
          ref: fe9cf567169e19059e0330d08769fe454336ef94
          path: gtn1-source
      - name: Bundle GTN1 artwork and offline fonts
        run: bash scripts/sync_gtn1_assets.sh gtn1-source
      - name: Verify complete GTN1 content bundle
        run: python scripts/verify_gtn1_assets.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows project
        run: flutter create --platforms=windows --project-name=gtn_2 --org=com.jarrlyyy .
      - name: Install dependencies
        run: flutter pub get
      - name: Read app version
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          if ($line -notmatch '^version:\s*([^+]+)') { throw 'Could not read app version from pubspec.yaml' }
          Add-Content $env:GITHUB_ENV "APP_VERSION=$($Matches[1])"
      - name: Build Windows debug
        run: flutter build windows --debug --build-name="$env:APP_VERSION" --build-number="$env:GITHUB_RUN_NUMBER" --dart-define=APP_VERSION="$env:APP_VERSION" --dart-define=APP_BUILD_NUMBER="$env:GITHUB_RUN_NUMBER"
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Debug/* -DestinationPath gtn-2-windows.zip
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: gtn-2-windows
          path: gtn-2-windows.zip
          if-no-files-found: error
          retention-days: 7


  publish-debug-latest:
    name: Publish Android and Windows debug-latest
    needs: [android, windows]
    if: false # Re-enable only after the GTN1 full-port verification gate passes.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: gtn-2-debug-android
          path: release/android
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: gtn-2-windows
          path: release/windows
      - name: Prepare checksums and platform manifests
        shell: bash
        run: |
          set -euo pipefail
          test -s release/android/app-debug.apk
          test -s release/android/android-debug-certificate-sha256.txt
          test -s release/windows/gtn-2-windows.zip
          mv release/android/app-debug.apk release/android/GuessTheNumber-debug.apk
          cd release/android
          sha256sum GuessTheNumber-debug.apk > SHA256SUMS
          android_sha="$(cut -d ' ' -f 1 SHA256SUMS)"
          android_cert_sha="$(tr -d '\r\n' < android-debug-certificate-sha256.txt | tr '[:upper:]' '[:lower:]')"
          [[ "$android_cert_sha" =~ ^[a-f0-9]{64}$ ]]
          cd ../windows
          sha256sum gtn-2-windows.zip > SHA256SUMS-WINDOWS
          windows_sha="$(cut -d ' ' -f 1 SHA256SUMS-WINDOWS)"
          version_name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' "$GITHUB_WORKSPACE/pubspec.yaml" | head -1)"
          test -n "$version_name"
          printf '{"channel":"android-debug","packageName":"com.jarrlyyy.gtn_2","versionName":"%s","versionCode":%s,"runNumber":%s,"commit":"%s","sha256":"%s","signingCertificateSha256":"%s","assetName":"GuessTheNumber-debug.apk"}\n' "$version_name" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$android_sha" "$android_cert_sha" > "$GITHUB_WORKSPACE/release/android/update-manifest.json"
          printf '{"channel":"windows-debug","versionName":"%s","versionCode":%s,"runNumber":%s,"commit":"%s","sha256":"%s","assetName":"gtn-2-windows.zip"}\n' "$version_name" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$windows_sha" > "$GITHUB_WORKSPACE/release/windows/windows-update-manifest.json"
      - name: Publish replaceable debug-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(printf 'GTN2 Debug Latest #%s\n\nVersion: %s\nCommit: %s\n\n- Android debug APK and SHA-256 manifest.\n- Windows desktop package and SHA-256 manifest.\n- Published only after both platform builds succeed on main/master.' "$GITHUB_RUN_NUMBER" "$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | head -1)" "$GITHUB_SHA")"
          gh release view debug-latest >/dev/null 2>&1 || gh release create debug-latest --prerelease --latest=false --target "$GITHUB_SHA" --title "GTN2 Debug Latest" --notes "Publishing Android and Windows builds..."
          gh release upload debug-latest \
            release/android/GuessTheNumber-debug.apk \
            release/android/SHA256SUMS \
            release/android/update-manifest.json \
            release/windows/gtn-2-windows.zip \
            release/windows/SHA256SUMS-WINDOWS \
            release/windows/windows-update-manifest.json \
            --clobber
          gh release edit debug-latest --target "$GITHUB_SHA" --title "GTN2 Debug Latest" --notes "$notes" --prerelease
          test "$(gh release view debug-latest --json body --jq .body)" = "$notes"
