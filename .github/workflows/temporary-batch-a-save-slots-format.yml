name: Temporary Batch A Save Slots formatter

on:
  push:
    branches: ['batch-a/creative-save-active-slot']

permissions:
  contents: write

concurrency:
  group: batch-a-save-slots-format
  cancel-in-progress: false

jobs:
  format-save-slots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format only Save Slots page
        run: dart format lib/saves/save_slots_page.dart
      - name: Commit only the formatted page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/saves/save_slots_page.dart
          if git diff --cached --quiet; then
            echo "Save Slots page already formatted."
          else
            git commit -m "style(saves): apply Dart formatter to Save Slots page"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
