name: gtn_2
description: A clean Flutter-first rebuild of GuessTheNumber.
publish_to: none
version: 2.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  audioplayers: ^6.1.0
  file_picker: ^10.3.10
  crypto: ^3.0.6
  open_filex: ^4.7.0
  flutter_svg: ^2.2.0
  material_3_expressive: 1.2.0
  material_ui: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/locales/
    - assets/game/
    - assets/fonts/
    - assets/gtn1/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 100
          # Variable font provides the full supported weight range.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VariableFont_wght.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf
        - asset: assets/fonts/JetBrainsMono-Italic-VariableFont_wght.ttf
          style: italic
